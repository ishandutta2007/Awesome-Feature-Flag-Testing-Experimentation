<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="toggleGradOn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="toggleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Embedded Animation Styles -->
    <style>
      .pulse-slow {
        animation: pulseSlow 6s ease-in-out infinite alternate;
      }
      .pulse-fast {
        animation: pulseFast 3s ease-in-out infinite alternate;
      }
      .toggle-shift {
        animation: toggleSlide 4s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 6;
        animation: flowDash 20s linear infinite;
      }
      .dash-flow-reverse {
        stroke-dasharray: 6 6;
        animation: flowDashRev 15s linear infinite;
      }
      .wave-float {
        animation: waveAnim 5s ease-in-out infinite alternate;
      }
      .beacon {
        animation: beaconGlow 2s ease-in-out infinite alternate;
      }
      @keyframes pulseSlow {
        0% { transform: scale(1) translate(0, 0); opacity: 0.25; }
        100% { transform: scale(1.15) translate(-10px, 15px); opacity: 0.45; }
      }
      @keyframes pulseFast {
        0% { transform: scale(1); opacity: 0.3; }
        100% { transform: scale(1.25); opacity: 0.6; }
      }
      @keyframes toggleSlide {
        0%, 20% { transform: translateX(0px); }
        80%, 100% { transform: translateX(46px); }
      }
      @keyframes flowDash {
        from { stroke-dashoffset: 200; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes flowDashRev {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 200; }
      }
      @keyframes waveAnim {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes beaconGlow {
        0% { r: 4px; opacity: 0.6; }
        100% { r: 9px; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Grid Pattern Overlay -->
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Dynamic Ambient Glowing Orbs (in background behind text) -->
  <g>
    <circle cx="150" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" class="pulse-slow" />
    <circle cx="1050" cy="280" r="160" fill="#818cf8" filter="url(#glow)" class="pulse-slow" />
    <circle cx="600" cy="380" r="120" fill="#c084fc" filter="url(#glow)" class="pulse-fast" />
  </g>

  <!-- Animated Dynamic Background Flowlines / Feature Branch Tracks -->
  <g fill="none" stroke-width="2" opacity="0.35">
    <path d="M -50 80 C 300 120, 450 40, 800 90 C 1000 120, 1150 70, 1250 80" stroke="#38bdf8" class="dash-flow" />
    <path d="M -50 320 C 250 280, 500 360, 850 310 C 1050 280, 1150 330, 1250 320" stroke="#818cf8" class="dash-flow-reverse" />
    <path d="M 100 0 C 180 180, 220 220, 300 400" stroke="#c084fc" stroke-dasharray="4 8" opacity="0.4" />
    <path d="M 1100 0 C 1020 180, 980 220, 900 400" stroke="#38bdf8" stroke-dasharray="4 8" opacity="0.4" />
  </g>

  <!-- Feature Flag Animated Interactive Toggle Graphics (Decorative Background / Sides) -->
  <!-- Left Side: Toggle switch A (Off to On) -->
  <g transform="translate(70, 180)" class="wave-float">
    <rect x="0" y="0" width="100" height="54" rx="27" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <g class="toggle-shift">
      <circle cx="27" cy="27" r="19" fill="url(#toggleGradOn)" filter="url(#toggleGlow)" />
      <path d="M 21 27 L 25 31 L 33 23" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <!-- Variant A/B Tag -->
    <rect x="18" y="64" width="64" height="20" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <text x="50" y="78" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">VARIANT A</text>
  </g>

  <!-- Right Side: Progressive Rollout Experiment Card -->
  <g transform="translate(1010, 150)" class="wave-float">
    <rect x="0" y="0" width="130" height="110" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="1.8" opacity="0.9" />
    <!-- Mini progress bars -->
    <text x="15" y="25" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ROLLOUT: 50%</text>
    <rect x="15" y="33" width="100" height="8" rx="4" fill="#1e293b" />
    <rect x="15" y="33" width="50" height="8" rx="4" fill="url(#primaryGrad)" />
    
    <text x="15" y="62" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">CONFIDENCE</text>
    <text x="15" y="80" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold">99.4% Lift</text>
    <circle cx="110" cy="74" r="5" fill="#10b981" class="beacon" />
    
    <!-- Mini chart line -->
    <path d="M 15 98 Q 40 92, 65 95 T 115 88" fill="none" stroke="#38bdf8" stroke-width="2" />
  </g>

  <!-- Foreground Main Content: Typography and Badges (Guaranteed Foreground) -->
  <g transform="translate(600, 0)">
    <!-- Top Decorative Badge -->
    <g transform="translate(0, 75)">
      <rect x="-165" y="0" width="330" height="32" rx="16" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="-140" cy="16" r="5" fill="#10b981" />
      <text x="8" y="21" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.5" text-anchor="middle">
        PROGRESSIVE DELIVERY &amp; EXPERIMENTATION
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Awesome Feature Flags
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" fill="#e2e8f0">
      Feature Flags, A/B Testing &amp; Progressive Delivery Ecosystem
    </text>

    <!-- Key Categories Pills in Foreground -->
    <g transform="translate(0, 270)">
      <!-- Pill 1 -->
      <g transform="translate(-250, 0)">
        <rect x="0" y="0" width="150" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="75" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚩 Feature Flags</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-85, 0)">
        <rect x="0" y="0" width="170" height="36" rx="18" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
        <text x="85" y="23" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🧪 A/B Experimentation</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(100, 0)">
        <rect x="0" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
        <text x="80" y="23" fill="#e879f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 Canary &amp; Rollouts</text>
      </g>
    </g>

    <!-- Bottom Secondary Info -->
    <text x="0" y="350" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Curated List of SaaS Platforms &amp; Open-Source Self-Hosted Solutions
    </text>
  </g>
</svg>
